name: Refresh Payment Metrics

on:
  schedule:
    - cron: '3 * * * *'   # every hour at :03 UTC
  workflow_dispatch:        # allow manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit & push

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Run refresh script
        env:
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
        run: |
          python refresh.py

      - name: Commit & push metrics
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add payment_metrics.json
          git diff --staged --quiet || git commit -m "chore: refresh metrics $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
